version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: personality-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: personality_quiz
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d personality_quiz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personality-quiz-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: personality-quiz-network

